# Maestro Test: Flutter Web Semantics Toggle
# Simple version - tests basic visibility after semantics enabled
# For full JavaScript testing, use the manual test documentation

url: "http://localhost:8080?enableSemantics=true"
jsEngine: graaljs # must be in top flow not subflow
---
- launchApp

# Wait for page to load
- assertNotVisible: "Definiely not there"
- assertNotVisible: "Go to Page 1"
- tapOn: "visibleButton"
- tapOn: "invisibleButton"
- assertVisible: "Go to Page 1"

