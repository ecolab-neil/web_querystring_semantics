<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web_querystring_semantics">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>web_querystring_semantics</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .flutter-container {position: relative;width: 100%;height: 100vh;}

    /* Style for the invisible button */
    .invisible-button {
        position: absolute;top: 1px;left: 1px;z-index: 1000;width: 1px; height: 1px;
        background-color: transparent; /* Make it transparent */
        color: transparent; /* Make text color transparent */
        border: none;      /* Remove borders */
        cursor: pointer;   /* Show pointer cursor on hover */
    }

  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('invisibleButton').addEventListener('click', function() {
          document.querySelector('flt-semantics-placeholder[aria-label="Enable accessibility"]')
              .click();
      });
    });
  </script>
</head>
<body>
  <!-- Flutter container with button  on top -->
  <div class="flutter-container" id="flutter_host">
    <!-- Flutter app will render here -->
    <script src="flutter_bootstrap.js" async></script>
    <!-- button so that automated test can tap this button
     and its javascript can tap flutter's accessibility toggle-->
    <button class="invisible-button" id="invisibleButton"></button>
  </div>
</body>
</html>
