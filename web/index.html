invisibleButton.click();

  <!-- Semantics verification function -->
  <script>
    // Make this function globally available for Flutter to call
    window.verifySemanticsInDOM = function() {
      const fltSemantics = document.querySelectorAll('flt-semantics');
      const buttons = document.querySelectorAll('[role="button"]');
      const ariaLabels = document.querySelectorAll('[aria-label]');
      const roles = document.querySelectorAll('[role]');
      
      const url = new URLSearchParams(window.location.search);
      const urlEnabled = url.get('enableSemantics') === 'true';
      
      const hasSubstantialSemantics = fltSemantics.length > 5 && buttons.length > 0;
      
      const result = {
        fltSemanticsCount: fltSemantics.length,
        buttonsCount: buttons.length,
        ariaLabelsCount: ariaLabels.length,
        rolesCount: roles.length,
        urlEnabled: urlEnabled,
        actuallyWorking: hasSubstantialSemantics,
        page: window.location.pathname,
        timestamp: new Date().toISOString()
      };
      
      console.log('='.repeat(60));
      console.log('🎯 SEMANTICS VERIFICATION');
      console.log('='.repeat(60));
      console.log(`📊 Semantic Elements (flt-semantics): ${fltSemantics.length}`);
      console.log(`🔘 Buttons with role: ${buttons.length}`);
      console.log(`🏷️  ARIA Labels: ${ariaLabels.length}`);
      console.log(`🎭 Total Roles: ${roles.length}`);
      console.log(`🌐 Full URL: ${window.location.href}`);
      console.log(`🌐 URL Parameter: enableSemantics=${url.get('enableSemantics') || 'not set'}`);
      console.log(`📍 Page: ${window.location.pathname}`);
      console.log(`🔌 Port: ${window.location.port || 'default'}`);
      console.log('─'.repeat(60));
      
      if (hasSubstantialSemantics) {
        console.log('✅ SUCCESS: Semantics are ENABLED and working');
        console.log('   Screen readers can read this page!');
        
        // Visual indicator
        document.body.style.border = '5px solid green';
        document.title = '[✅ ENABLED] ' + document.title.replace(/^\[.*?\] /, '');
      } else {
        console.log('✅ Semantics are DISABLED');
        console.log('   Page has minimal accessibility');
        
        // Visual indicator
        document.body.style.border = '5px solid red';
        document.title = '[❌ DISABLED] ' + document.title.replace(/^\[.*?\] /, '');
      }
      
      console.log('='.repeat(60));
      
      return result;
    };
    
    /**
     * Determines if accessibility should be auto-enabled based on port configuration
     * 
     * @returns {boolean} true if auto-enable is configured for current port
     * 
     * Port configuration:
     * - Port 1111: Auto-enable (true) - Testing environment
     * - Port 8080: Auto-enable (falase) - Development environment
     * - Port 0000: Auto-disable (false) - Disabled for testing
     * - Other ports: Follow URL parameter
     */
    function shouldAutoEnableAccessibility() {
      const port = window.location.port;
      const config = {
        '1111': true,   // Auto-enable for testing
        '8080': false,   // Auto-disable for development
        '0000': false,  // Explicitly disabled for testing disabled state
        // not sure yet if port 0000 is possible, considr swtiching to 1234 and 4321 or deploying with text
      };
      
      return config[port] === true;
    }
    
    /**
     * Attempts to click the Flutter invisible accessibility button
     * This simulates the user clicking the invisible "Enable accessibility" button
     * 
     * According to Flutter docs: https://docs.flutter.dev/ui/accessibility/web-accessibility#invisible-button
     * The button has aria-label="Enable accessibility"
     * 
     * @returns {boolean} true if button was found and clicked, false otherwise
     */
    function autoEnableAccessibility() {
      console.log('🔍 Searching for Flutter invisible accessibility button...');
      
      const selector = 'flt-semantics-placeholder[aria-label="Enable accessibility"]';
      console.log(`Trying selector: "${selector}"`);
      
      const invisibleButton = document.querySelector(selector);
      
      if (!invisibleButton) {
        console.log('❌ Flutter invisible button not found');
        return false;
      }
      
      console.log('✅ Found invisible button');
      console.log(`   Element:`, invisibleButton);
      console.log(`   aria-label: ${invisibleButton.getAttribute('aria-label')}`);
      
      try {
        invisibleButton.click();
        console.log('✅ Clicked button - accessibility enabled');
        
        // Verify after delay
        setTimeout(() => {
          const verify = verifySemanticsInDOM();
          if (verify.actuallyWorking) {
            console.log('🎉 Verification confirmed: Semantics working!');
          } else {
            console.log('⚠️ Warning: Button clicked but semantics may not be active');
          }
        }, 300);
        
        return true;
      } catch (error) {
        console.error('❌ Error clicking button:', error);
        return false;
      }
    }
    
    // Auto-verify on page load
    window.addEventListener('load', () => {
      setTimeout(() => {
        console.log('🔍 Auto-checking semantics on page load...');
        window.verifySemanticsInDOM();
        
        // Auto-enable accessibility based on port configuration
        if (shouldAutoEnableAccessibility()) {
          console.log(`🚀 Port ${window.location.port} configured for auto-enable`);
          autoEnableAccessibility();
        } else if (window.location.port === '0000') {
          console.log('🚫 Port 0000 configured for auto-disable - skipping auto-enable');
        }
      }, 500);
    });
  </script>

<body>
  <!-- Flutter container with buttons stacked on top -->
  <div class="flutter-container" id="flutter_host">
    <!-- Flutter app will render here -->
    <script src="flutter_bootstrap.js" async></script>
    
    <!-- Buttons stacked on top of Flutter -->
    <button class="invisible-button" id="visibleButton">Pretend Visible Button</button>
    <button class="invisible-button" aria-label="Invisible Button" id="invisibleButton"></button>
    <button class="invisible-offscreen-button" id="invisibleOffscreenButton"></button>
